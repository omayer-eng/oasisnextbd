<title>VenGuard Connected</title>
<meta name="theme-color" content="#0B2A4A">
<meta name="description" content="VenGuard Connected: see your VenGuard, close the gas from your phone and get alerts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first. App bar on top, one column of cards, floating tab bar at the bottom.
   From 900px the tabs move into the app bar and the kitchen page splits into two columns.
   Brand: VenGuard Brand Guidelines. Red / amber / green are the safety states and nothing else. */
:root {
  --navy: #0B2A4A;
  --navy-2: #12355C;
  --teal: #12B5A6;
  --teal-ink: #0A7F76;
  --teal-soft: #DDF3F0;
  --bg: #EEF3F7;
  --card: #FFFFFF;
  --sunken: #F3F7FA;
  --ink: #0A1622;
  --ink-2: #33475B;
  --muted: #5B6B7A;
  --line: #DCE6ED;
  --line-2: #C9D6E0;
  --on-accent: #FFFFFF;
  --solid: #0B2A4A;      /* strong button / selected chip background */
  --solid-ink: #FFFFFF;
  --accent: #0A7F76;     /* primary action */
  --accent-ink: #FFFFFF;
  --alarm-bg: #B42318;
  --mark: #0B2A4A;
  --safe: #13804A;   --safe-bg: #E2F3E9;   --safe-ring: rgba(19,128,74,.18);
  --warn: #8F5500;   --warn-bg: #FFF0D4;   --warn-ring: rgba(201,124,0,.20);
  --danger: #B42318; --danger-bg: #FDE6E3; --danger-ring: rgba(180,35,24,.22);
  --off: #56677A;    --off-bg: #E8EEF3;    --off-ring: rgba(86,103,122,.16);
  --shadow-1: 0 1px 2px rgba(11,42,74,.05), 0 2px 8px rgba(11,42,74,.04);
  --shadow-2: 0 2px 6px rgba(11,42,74,.06), 0 12px 32px rgba(11,42,74,.08);
  --font-bn: "Noto Sans Bengali", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-en: "Inter", "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-lg: 24px; --r-md: 16px; --r-sm: 12px;
  --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #E6EEF5; --navy-2: #1B3E66; --teal-ink: #4FD6C8; --teal-soft: #0F3B3A;
    --bg: #071426; --card: #0E2240; --sunken: #0A1B33; --ink: #EAF1F6; --ink-2: #C3D1DC; --muted: #93A7B8;
    --line: #1C3656; --line-2: #2A4A70; --on-accent: #051222;
    --safe: #63D49C; --safe-bg: #0E3426; --safe-ring: rgba(99,212,156,.16);
    --warn: #F3B75C; --warn-bg: #3A2A10; --warn-ring: rgba(243,183,92,.16);
    --danger: #FF8A7E; --danger-bg: #461A1B; --danger-ring: rgba(255,138,126,.20);
    --off: #9DB0C0; --off-bg: #172E4C; --off-ring: rgba(157,176,192,.14);
    --shadow-1: none; --shadow-2: 0 12px 32px rgba(0,0,0,.35);
    --solid: #4FD6C8; --solid-ink: #051222; --accent: #4FD6C8; --accent-ink: #051222; --alarm-bg: #8E1D14; --mark: #1B3E66;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --navy: #E6EEF5; --navy-2: #1B3E66; --teal-ink: #4FD6C8; --teal-soft: #0F3B3A;
  --bg: #071426; --card: #0E2240; --sunken: #0A1B33; --ink: #EAF1F6; --ink-2: #C3D1DC; --muted: #93A7B8;
  --line: #1C3656; --line-2: #2A4A70; --on-accent: #051222;
  --safe: #63D49C; --safe-bg: #0E3426; --safe-ring: rgba(99,212,156,.16);
  --warn: #F3B75C; --warn-bg: #3A2A10; --warn-ring: rgba(243,183,92,.16);
  --danger: #FF8A7E; --danger-bg: #461A1B; --danger-ring: rgba(255,138,126,.20);
  --off: #9DB0C0; --off-bg: #172E4C; --off-ring: rgba(157,176,192,.14);
  --shadow-1: none; --shadow-2: 0 12px 32px rgba(0,0,0,.35);
  --solid: #4FD6C8; --solid-ink: #051222; --accent: #4FD6C8; --accent-ink: #051222; --alarm-bg: #8E1D14; --mark: #1B3E66;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.65 var(--font-bn); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
html[lang="en"] body { font-family: var(--font-en); line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
button { -webkit-appearance: none; appearance: none; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; border-radius: 10px; }
.num { font-variant-numeric: tabular-nums; }
.en { font-family: var(--font-en); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { color: var(--navy); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.45rem, 4.6vw, 1.85rem); line-height: 1.25; letter-spacing: -.015em; font-weight: 700; }
html[lang="bn"] h1 { letter-spacing: 0; line-height: 1.4; }
h2 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.micro { font-size: .78rem; }

/* ---------- App bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid transparent; transition: border-color .2s; }
.bar.scrolled { border-bottom-color: var(--line); }
.bar .in { max-width: 1120px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 9px; font: 800 1.12rem/1 var(--font-en); color: var(--navy); letter-spacing: -.01em; }
.brand svg { width: 28px; height: 28px; flex: none; }
.brand .tag { font: 700 .68rem/1 var(--font-en); letter-spacing: .04em; text-transform: uppercase; color: var(--teal-ink); background: var(--teal-soft); padding: 4px 7px; border-radius: 6px; }
.toptabs { display: none; gap: 2px; margin-left: 18px; }
.toptabs button { border: 0; background: none; cursor: pointer; padding: 8px 14px; border-radius: 999px; font-weight: 600; color: var(--muted); }
.toptabs button:hover { color: var(--navy); }
.toptabs button[aria-current="page"] { background: var(--card); color: var(--navy); box-shadow: var(--shadow-1); }
.seg { display: inline-flex; padding: 3px; background: var(--sunken); border: 1px solid var(--line); border-radius: 999px; }
.seg button { border: 0; background: none; cursor: pointer; padding: 5px 11px; border-radius: 999px; font-size: .86rem; font-weight: 600; color: var(--muted); line-height: 1.3; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--navy); box-shadow: var(--shadow-1); }
.bar .seg { margin-left: auto; }

main { max-width: 1120px; margin: 0 auto; padding-block: 8px 128px; padding-inline: 16px; }
.view { display: grid; gap: 16px; animation: enter .28s var(--ease) both; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Bottom tabs ---------- */
.tabs { position: fixed; z-index: 20; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-2); }
.tabs button { position: relative; border: 0; background: none; cursor: pointer; display: grid; justify-items: center; gap: 1px; padding: 7px 2px 6px; border-radius: 16px; font-size: .74rem; font-weight: 600; color: var(--muted); transition: color .15s, background .15s; }
.tabs button svg { width: 23px; height: 23px; }
.tabs button[aria-current="page"] { color: var(--navy); background: var(--sunken); }
.dot-badge { position: absolute; top: 4px; left: calc(50% + 7px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font: 700 .68rem/18px var(--font-en); text-align: center; box-shadow: 0 0 0 2px var(--card); }
@media (min-width: 900px) { .tabs { display: none; } .toptabs { display: flex; } main { padding-bottom: 56px; } }

/* ---------- Cards ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--shadow-1); min-width: 0; }
.card.tight { padding: 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.btn-card { all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer; }
.btn-card:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; border-radius: var(--r-lg); }
.btn-card .card { transition: transform .18s var(--ease), box-shadow .18s, border-color .18s; }
.btn-card:hover .card { border-color: var(--line-2); box-shadow: var(--shadow-2); }
.btn-card:active .card { transform: scale(.992); }
.grid { display: grid; gap: 16px; }
@media (min-width: 760px) { .grid.two { grid-template-columns: 1fr 1fr; } }
.section-label { font-size: .8rem; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin: 6px 4px -4px; }
html[lang="bn"] .section-label { text-transform: none; letter-spacing: 0; font-size: .86rem; }

/* ---------- State language ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px 4px 8px; border-radius: 999px; font-size: .84rem; font-weight: 700; white-space: nowrap; }
.chip svg { width: 16px; height: 16px; flex: none; }
.s-safe { --c: var(--safe); --cb: var(--safe-bg); --cr: var(--safe-ring); }
.s-closed, .s-warn { --c: var(--warn); --cb: var(--warn-bg); --cr: var(--warn-ring); }
.s-danger { --c: var(--danger); --cb: var(--danger-bg); --cr: var(--danger-ring); }
.s-off { --c: var(--off); --cb: var(--off-bg); --cr: var(--off-ring); }
.chip { color: var(--c); background: var(--cb); }
.orb { position: relative; display: grid; place-items: center; border-radius: 50%; color: var(--c); background: var(--cb); flex: none; }
.orb::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 6px solid var(--cr); }
.orb svg { width: 46%; height: 46%; }
.s-safe .orb::after, .orb.s-safe::after { animation: breathe 4.8s ease-in-out infinite; }
.s-danger .orb::after, .orb.s-danger::after { animation: alarm 1.4s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.08); opacity: .45; } }
@keyframes alarm { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.14); opacity: .35; } }

/* ---------- Home ---------- */
.greet { display: grid; gap: 6px; padding: 8px 4px 4px; }
.greet .hello { color: var(--muted); font-weight: 500; }
.summary { display: inline-flex; align-items: center; gap: 10px; color: var(--navy); }
.summary .pip { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 4px var(--cr); }
.kcard { display: grid; gap: 16px; }
.kcard .top { display: flex; gap: 14px; align-items: center; }
.kcard .orb { width: 56px; height: 56px; }
.kcard .names { min-width: 0; flex: 1; }
.kcard .place { font-weight: 700; color: var(--navy); font-size: 1.06rem; line-height: 1.35; overflow-wrap: anywhere; }
.kcard .room { color: var(--muted); font-size: .9rem; }
.chev { width: 20px; height: 20px; color: var(--muted); flex: none; }
.metrics { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 1px; background: var(--line); border-radius: var(--r-md); overflow: hidden; }
.metric { background: var(--sunken); padding: 10px 12px; min-width: 0; }
.metric .l { font-size: .74rem; color: var(--muted); font-weight: 600; }
.metric .v { font-weight: 700; color: var(--navy); font-size: 1.02rem; display: flex; align-items: baseline; gap: 3px; white-space: nowrap; }
.metric svg.spark { width: 100%; height: 22px; display: block; margin-top: 2px; }
.kfoot { display: flex; justify-content: space-between; color: var(--muted); font-size: .84rem; }
.bcard .top { display: flex; gap: 14px; align-items: center; }
.bcard .bicon { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; background: var(--sunken); color: var(--navy); flex: none; }
.bcard .bicon svg { width: 28px; height: 28px; }
.matrix { display: grid; grid-template-columns: repeat(auto-fill, 14px); gap: 6px; margin-top: 14px; }
.matrix i { width: 14px; height: 14px; border-radius: 4px; background: var(--c); opacity: .9; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: .84rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }

/* Alarm strip (top of any screen) */
.alarm { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 16px; border-radius: var(--r-lg); background: var(--alarm-bg); color: #fff; cursor: pointer; border: 0; text-align: left; width: 100%; box-shadow: 0 10px 30px rgba(180,35,24,.28); }
.alarm .orb { width: 44px; height: 44px; background: rgba(255,255,255,.18); color: #fff; }
.alarm .orb::after { border-color: rgba(255,255,255,.25); animation: alarm 1.4s ease-in-out infinite; }
.alarm strong { display: block; font-size: 1.02rem; }
.alarm span { font-size: .9rem; opacity: .95; }
.alarm .go { font-weight: 700; white-space: nowrap; }

/* ---------- Kitchen page ---------- */
.crumbs { display: flex; align-items: center; gap: 4px; }
.back { border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px 6px 2px; border-radius: 999px; color: var(--teal-ink); font-weight: 600; }
.back svg { width: 20px; height: 20px; }
.kitchen-layout { display: grid; gap: 16px; }
@media (min-width: 900px) { .kitchen-layout { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; } .kitchen-layout > .col { display: grid; gap: 16px; } }
@media (max-width: 899px) { .kitchen-layout > .col { display: contents; } }
.hero { display: grid; gap: 18px; justify-items: center; text-align: center; padding: 28px 20px 24px; }
.hero .orb { width: 120px; height: 120px; }
.hero .orb::after { inset: -10px; border-width: 10px; }
.hero .where { color: var(--muted); font-size: .92rem; font-weight: 600; }
.hero h1 { margin-top: 2px; }
.hero .explain { color: var(--ink-2); max-width: 34ch; }
.steps-do { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; text-align: left; width: 100%; max-width: 420px; counter-reset: s; }
.steps-do li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.steps-do li::before { counter-increment: s; content: counter(s); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--cb); color: var(--c); font: 700 .85rem/1 var(--font-en); }
html[lang="bn"] .steps-do li::before { content: counter(s, bengali); font-family: var(--font-bn); }
.gauge-wrap { display: grid; justify-items: center; }
.gauge { width: min(260px, 100%); height: auto; overflow: visible; }
.gauge .track { stroke: var(--sunken); }
.gauge .val { stroke: var(--teal-ink); transition: stroke-dasharray .8s var(--ease), stroke .3s; }
.gauge .val.hot { stroke: var(--danger); }
.gauge .tick { stroke: var(--ink); }
.gauge text { fill: var(--muted); font: 600 11px var(--font-en); }
.gauge .big { fill: var(--navy); font: 800 40px var(--font-en); letter-spacing: -.02em; }
html[lang="bn"] .gauge .big { font-family: var(--font-bn); font-weight: 700; }
.gauge .unit { fill: var(--muted); font: 600 13px var(--font-en); }
.spark-wrap { width: 100%; }
.spark-wrap .cap { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
.spark-big { width: 100%; height: 64px; display: block; }
.spark-big .area { fill: var(--teal-soft); }
.spark-big .line { fill: none; stroke: var(--teal-ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.spark-big .limit { stroke: var(--danger); stroke-width: 1.5; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; opacity: .7; }
.spark-big .end { fill: var(--teal-ink); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fact { background: var(--sunken); border-radius: var(--r-md); padding: 12px 14px; display: grid; gap: 6px; min-width: 0; }
.fact .l { font-size: .78rem; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.fact .l svg { width: 16px; height: 16px; }
.fact .v { font-weight: 700; color: var(--navy); font-size: 1.05rem; }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--teal-ink); transition: width .6s var(--ease); }
.meter.low i { background: var(--warn); }
.signal { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
.signal i { width: 4px; border-radius: 1px; background: var(--line-2); }
.signal i.on { background: var(--teal-ink); }

/* Close control */
.control { display: grid; gap: 14px; }
.hold { position: relative; overflow: hidden; width: 100%; min-height: 64px; border: 0; border-radius: 18px; cursor: pointer; background: var(--solid); color: var(--solid-ink); display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; font-size: 1.06rem; padding: 12px 18px; touch-action: none; user-select: none; -webkit-user-select: none; transition: transform .12s var(--ease); }
.hold svg { width: 24px; height: 24px; flex: none; position: relative; }
.hold span { position: relative; }
.hold .fill { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(0); background: var(--teal); opacity: .55; }
.hold.pressing { transform: scale(.985); }
.hold[disabled] { opacity: .5; cursor: not-allowed; }
.hint-row { display: flex; gap: 10px; align-items: flex-start; color: var(--ink-2); font-size: .92rem; }
.hint-row svg { width: 20px; height: 20px; flex: none; margin-top: 2px; color: var(--muted); }
.lifecycle { list-style: none; margin: 0; padding: 4px 0 0; display: grid; gap: 0; }
.lifecycle li { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: start; position: relative; padding-bottom: 14px; }
.lifecycle li:last-child { padding-bottom: 0; }
.lifecycle li::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--line); }
.lifecycle li:last-child::before { display: none; }
.lifecycle .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--sunken); color: var(--muted); border: 2px solid var(--line); position: relative; z-index: 1; }
.lifecycle .n svg { width: 16px; height: 16px; }
.lifecycle .done .n { background: var(--safe); border-color: var(--safe); color: var(--card); }
.lifecycle .done .n svg { stroke-width: 3; }
.lifecycle .active .n { border-color: var(--teal-ink); color: var(--teal-ink); background: var(--card); }
.lifecycle .wait .n { border-color: var(--warn); color: var(--warn); background: var(--card); }
.lifecycle .t { font-weight: 600; color: var(--ink); padding-top: 2px; }
.lifecycle .pending .t { color: var(--muted); font-weight: 500; }
.lifecycle .d { color: var(--muted); font-size: .86rem; font-weight: 400; display: block; }
.lifecycle time { color: var(--muted); font-size: .82rem; padding-top: 4px; white-space: nowrap; }
.spin { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.reopen { display: grid; gap: 12px; }
.reopen ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.reopen li { background: var(--sunken); border-radius: var(--r-md); padding: 12px 10px; display: grid; justify-items: center; gap: 8px; text-align: center; font-size: .86rem; color: var(--ink-2); }
.reopen li svg { width: 30px; height: 30px; color: var(--navy); }
.callout { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; padding: 14px; border-radius: var(--r-md); background: var(--cb); color: var(--ink); }
.callout > svg { width: 22px; height: 22px; color: var(--c); margin-top: 2px; }
.callout strong { color: var(--c); display: block; }
.callout p { color: var(--ink-2); font-size: .92rem; }

/* Timeline */
.daylabel { font-size: .8rem; font-weight: 700; color: var(--muted); margin: 14px 0 4px; }
.daylabel:first-child { margin-top: 0; }
.events { list-style: none; margin: 0; padding: 0; }
.events li { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; }
.events li + li { border-top: 1px solid var(--line); }
.events .ic { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: var(--c); background: var(--cb); }
.events .ic svg { width: 19px; height: 19px; }

    S.view = v; S.ui.so = false; S.ui.rm = null;
    if (extra) Object.keys(extra).forEach(function (k) { S[k] = extra[k]; });
    render(); window.scrollTo(0, 0);
    var h = $("#main h1"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
  }
  function setLang(l) {
    S.lang = l; document.documentElement.lang = l;
    try { localStorage.setItem("vg_lang", l); } catch (e) {}
    render();
  }

  /* ====================== hold-to-close sheet ====================== */
  function openSheet(id) {
    var d = S.devices[id];
    var root = $("#sheetRoot");
    root.innerHTML = '<div class="scrim" data-sheet-cancel></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" aria-describedby="shB"><div class="handle"></div><span class="orb s-closed">' + I.valveOff + '</span><h2 id="shT">' + esc(t("sheetTitle", { place: placeOf(d) })) + '</h2><p id="shB" class="muted">' + esc(t("sheetBody")) + "</p>" +
      '<button type="button" class="hold" id="holdBtn"><span class="fill" id="holdFill"></span>' + I.valve + '<span id="holdLbl">' + esc(t("holdLabel")) + '</span></button><button type="button" class="btn ghost block" data-sheet-cancel>' + esc(t("cancel")) + "</button></div>";
    S.sheet = id;
    var btn = $("#holdBtn"), fill = $("#holdFill"), lbl = $("#holdLbl"), start = 0, raf = 0, active = false;
    function frame() { var p = Math.min(1, (Date.now() - start) / HOLD_MS); fill.style.transform = "scaleX(" + p + ")"; if (p >= 1) { active = false; vibrate(40); startClose(id); } else raf = requestAnimationFrame(frame); }
    function down(e) { if (active) return; if (e) e.preventDefault(); active = true; start = Date.now(); btn.classList.add("pressing"); lbl.textContent = t("holdKeep"); vibrate(10); raf = requestAnimationFrame(frame); }
    function up() { if (!active) return; active = false; cancelAnimationFrame(raf); btn.classList.remove("pressing"); fill.style.transform = "scaleX(0)"; lbl.textContent = t("holdLabel"); }
    btn.addEventListener("pointerdown", down);
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (n) { btn.addEventListener(n, up); });
    btn.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    btn.addEventListener("keydown", function (e) { if ((e.key === " " || e.key === "Enter") && !e.repeat) down(e); });
    btn.addEventListener("keyup", function (e) { if (e.key === " " || e.key === "Enter") up(); });
    btn.focus();
  }
  function closeSheet() { $("#sheetRoot").innerHTML = ""; var back = S.sheet && $('[data-close="' + S.sheet + '"]'); S.sheet = null; if (back) back.focus(); }

  /* ============================ events ============================ */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("button, a, [data-open], [data-building]"); if (!el) return;
    var a = function (n) { return el.getAttribute(n); };
    if (el.hasAttribute("data-lang")) return setLang(a("data-lang"));
    if (el.hasAttribute("data-go")) return go(a("data-go"), a("data-site") ? { site: a("data-site") } : null);
    if (el.hasAttribute("data-open")) return go("device", { device: a("data-open") });
    if (el.hasAttribute("data-building")) { S.ui.bf = "all"; return go("building", { site: a("data-building") }); }
    if (el.hasAttribute("data-close")) return openSheet(a("data-close"));
    if (el.hasAttribute("data-sheet-cancel")) return closeSheet();
    if (el.hasAttribute("data-bf")) { S.ui.bf = a("data-bf"); return render(); }
    if (el.hasAttribute("data-af")) { S.ui.af = a("data-af"); return render(); }
    if (el.hasAttribute("data-sim")) { var k = a("data-sim"); if (k === "reset") delete S.cmd[S.device]; DS.sim[k](S.device); return; }
    if (el.hasAttribute("data-rm-ask")) { S.ui.rm = a("data-rm-ask"); render(); var c = $('[data-rm="' + S.ui.rm + '"]'); if (c) c.focus(); return; }
    if (el.hasAttribute("data-rm")) {
      var p = a("data-rm").split(":"), s = site(p[0]), list = s.contacts.slice(); list.splice(+p[1], 1); S.ui.rm = null;
      return DS.saveContacts(s.id, list).then(function () { s.contacts = list; render(); toast(t("removed")); }, function (er) { toast(er.message); });
    }
    if (el.hasAttribute("data-renew")) return DS.renew(a("data-renew")).catch(function (er) { toast(er.message); });
    if (el.hasAttribute("data-notif")) { Notification.requestPermission().then(render, render); return; }
    if (el.hasAttribute("data-signout")) {
      if (!S.ui.so) { S.ui.so = true; render(); return; }
      return DS.signOut().then(function () { S.user = null; S.loaded = false; S.ui = { si: { step: "phone" } }; render(); });
    }
    if (el.hasAttribute("data-si-change")) { S.ui.si = { step: "phone" }; return render(); }
    if (el.hasAttribute("data-si-resend")) { var si = S.ui.si; DS.sendCode(si.phone).then(function () { si.resendAt = Date.now() + 30000; si.err = ""; render(); tickResend(); }, function (er) { si.err = er.message; render(); }); return; }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && S.sheet) closeSheet(); });
  document.addEventListener("change", function (e) {
    var k = e.target.getAttribute("data-sms"); if (!k) return;
    var p = k.split(":"), s = site(p[0]), list = s.contacts.map(function (c) { return Object.assign({}, c); });
    list[+p[1]].sms = e.target.checked;
    DS.saveContacts(s.id, list).then(function () { s.contacts = list; toast(t("saved")); }, function (er) { e.target.checked = !e.target.checked; toast(er.message); });
  });
  // OTP boxes: auto-advance, backspace, paste a whole code
  document.addEventListener("input", function (e) {
    var i = e.target.getAttribute("data-otp"); if (i == null) return;
    var v = ascii(e.target.value).replace(/\D/g, "");
    var boxes = $$("[data-otp]");
    if (v.length > 1) { v.split("").slice(0, 6 - +i).forEach(function (ch, j) { boxes[+i + j].value = ch; }); var nx = boxes[Math.min(5, +i + v.length)]; nx.focus(); }
    else { e.target.value = v; if (v && +i < 5) boxes[+i + 1].focus(); }
    if (boxes.every(function (b) { return b.value; })) $("#fCode").requestSubmit();
  });
  document.addEventListener("keydown", function (e) {
    var i = e.target.getAttribute && e.target.getAttribute("data-otp"); if (i == null) return;
    if (e.key === "Backspace" && !e.target.value && +i > 0) { var p = $$("[data-otp]")[+i - 1]; p.value = ""; p.focus(); e.preventDefault(); }
    if (e.key === "ArrowLeft" && +i > 0) $$("[data-otp]")[+i - 1].focus();
    if (e.key === "ArrowRight" && +i < 5) $$("[data-otp]")[+i + 1].focus();
  });
  function tickResend() { clearInterval(tickResend.t); tickResend.t = setInterval(function () { if (!S.ui.si || S.ui.si.step !== "code") return clearInterval(tickResend.t); render(); if (Date.now() > S.ui.si.resendAt) clearInterval(tickResend.t); }, 1000); }

  document.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.id === "fPhone") {
      var si = S.ui.si = S.ui.si || { step: "phone" }, ph = normPhone($("#inPhone").value);
      if (!ph) { si.err = t("badPhone"); render(); $("#inPhone").focus(); return; }
      si.busy = true; si.err = ""; render();
      DS.sendCode(ph).then(function () { S.ui.si = { step: "code", phone: ph, resendAt: Date.now() + 30000 }; lastView = null; render(); tickResend(); }, function (er) { si.busy = false; si.err = er.message; render(); });
    } else if (f.id === "fCode") {
      var s2 = S.ui.si, code = $$("[data-otp]").map(function (b) { return b.value; }).join("");
      if (code.length < 6 || s2.busy) return;
      s2.busy = true; s2.err = ""; render();
      DS.verify(code).then(function (u) { S.user = u; S.ui = {}; S.view = "home"; lastView = null; DS.subscribe(onData); render(); }, function (er) {
        s2.busy = false; s2.err = er.message; render(); $$("[data-otp]").forEach(function (b) { b.value = ""; }); $("[data-otp='0']").focus();
      });
    } else if (f.hasAttribute("data-add")) {
      var st = site(f.getAttribute("data-add")), nm = f.elements.name.value.trim(), pn = normPhone(f.elements.phone.value);
      var form = S.ui["add-" + st.id] = { nameErr: !nm, phoneErr: !pn, err: !nm ? t("needName") : !pn ? t("badPhone") : "" };
      if (form.err) { render(); (nm ? f.elements.phone : f.elements.name).focus(); return; }
      var list = st.contacts.concat([{ name: nm, phone: pn, sms: true }]);
      DS.saveContacts(st.id, list).then(function () { st.contacts = list; S.ui["add-" + st.id] = {}; f.reset(); render(); toast(t("saved")); }, function (er) { S.ui["add-" + st.id] = { err: er.message }; render(); });
    } else if (f.id === "fClaim") {
      var id = $("#inDev").value.trim().toUpperCase(), cc = ascii($("#inClaim").value).replace(/\D/g, "");
      var cl = S.ui.claim = { devErr: !/^VG-[A-Z0-9]{4,12}$/.test(id), codeErr: cc.length !== 6 };
      cl.err = cl.devErr ? t("badDevice") : cl.codeErr ? t("badClaim") : "";
      if (cl.err) { render(); return; }
      DS.claimDevice(id, cc).then(function () { S.ui.claim = {}; f.reset(); render(); toast(t("saved")); }, function (er) { S.ui.claim = { err: er.message }; render(); });
    }
  });
  window.addEventListener("scroll", function () { $("#bar").classList.toggle("scrolled", window.scrollY > 4); }, { passive: true });

  /* ============================ data in ============================ */
  var seenAlarm = {};
  function onData(d) {
    S.sites = d.sites; S.devices = d.devices; S.events = d.events; S.loaded = true;
    Object.keys(S.devices).forEach(function (k) {
      var dv = S.devices[k];
      // A new leak takes the person straight to that kitchen and buzzes the phone (if allowed).
      if (dv.alarm && !seenAlarm[k]) { vibrate([300, 120, 300, 120, 300]); announce(t("alarmTitle", { place: placeOf(dv) })); if (!S.sheet) { S.view = "device"; S.device = k; } }
      seenAlarm[k] = dv.alarm;
      // The valve state itself can confirm a close (covers a missed ack).
      var c = S.cmd[k];
      if (c && (c.stage === "waiting" || c.stage === "slow") && dv.valve === "closed") { c.stage = "done"; c.doneAt = Date.now(); clearTimeout(c.timer); toast(t("closedToast")); }
      // Once the valve is reopened at the stove, the old close story is finished.
      if (c && (c.stage === "done" || c.stage === "failed") && dv.valve === "open" && Date.now() - c.doneAt > 4000) delete S.cmd[k];
    });
    render();
  }

  /* ============================ start ============================ */
  document.documentElement.lang = S.lang;
  render();
  DS.restore(function (u) { S.user = u; render(); DS.subscribe(onData); }, function () { S.ui.si = { step: "phone" }; render(); });
})();
</script>
