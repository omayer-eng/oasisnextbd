    }

// Standard useInView hook for animation on scroll
function useInView(options = {}) {
  const ref = useRef(null);
  const [isVisible, setIsVisible] = useState(false);
  useEffect(() => {
    const observer = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) {
        setIsVisible(true);
        observer.disconnect();
      }
    }, { threshold: 0.1, ...options });
    if (ref.current) observer.observe(ref.current);
    return () => observer.disconnect();
  }, []);
  return [ref, isVisible];
}

// CANVAS BACKGROUND - Renders interactive IoT node connections with warm amber lights
function CanvasBackground({ mousePos }) {
  const canvasRef = useRef(null);
  const animRef = useRef(null);
  const nodesRef = useRef([]);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    const resize = () => {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    };
    resize();
    window.addEventListener('resize', resize);

    // Initial warm mesh nodes
    const count = 70;
    nodesRef.current = Array.from({ length: count }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
      r: 1.2 + Math.random() * 1.8,
    }));

    const draw = () => {
      if (!canvas) return;
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const nodes = nodesRef.current;
      const mp = mousePos.current;

      nodes.forEach(n => {
        // Subtle mouse attraction
        if (mp) {
          const dx = mp.x - n.x;
          const dy = mp.y - n.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 220) {
            n.vx += dx * 0.00005;
            n.vy += dy * 0.00005;
          }
        }
        
        // Dynamic speed limit
        const speed = Math.sqrt(n.vx * n.vx + n.vy * n.vy);
        if (speed > 1.0) { n.vx *= 0.96; n.vy *= 0.96; }

        n.x += n.vx;
        n.y += n.vy;
        
        // Wall bounce
        if (n.x < 0 || n.x > canvas.width) n.vx *= -1;
        if (n.y < 0 || n.y > canvas.height) n.vy *= -1;
        
        n.x = Math.max(0, Math.min(canvas.width, n.x));
        n.y = Math.max(0, Math.min(canvas.height, n.y));

        // Render node with warm orange amber glow
        let alpha = 0.25;
        if (mp) {
          const dx = mp.x - n.x;
          const dy = mp.y - n.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 200) alpha = 0.65;
        }
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 42, 31, ${alpha})`;
        ctx.fill();
      });

      // Draw mesh connectivity
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = nodes[i].x - nodes[j].x;
          const dy = nodes[i].y - nodes[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 140) {
            ctx.beginPath();
            ctx.moveTo(nodes[i].x, nodes[i].y);
            ctx.lineTo(nodes[j].x, nodes[j].y);
            ctx.strokeStyle = `rgba(255, 42, 31, ${0.06 * (1 - dist / 140)})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }

      animRef.current = requestAnimationFrame(draw);
    };

    animRef.current = requestAnimationFrame(draw);
    return () => {
      cancelAnimationFrame(animRef.current);
      window.removeEventListener('resize', resize);
    };
  }, []);

  return (
    <canvas
      ref={canvasRef}
      className="absolute inset-0 w-full h-full"
      style={{ pointerEvents: 'none' }}
    />
  );
}

  const [detectorOnline, setDetectorOnline] = useState(false);
  const [lastHeartbeatAt, setLastHeartbeatAt] = useState(0);
  const [hasReceivedHeartbeat, setHasReceivedHeartbeat] = useState(false);
  const [glowColor, setGlowColor] = useState('electric-blue');
  const [highestGasReading, setHighestGasReading] = useState(66);      // PPM
  const [highestSmokeReading, setHighestSmokeReading] = useState(12.1); // %
  const [gasThreshold, setGasThreshold] = useState(100);                // PPM threshold
  const [smokeThreshold, setSmokeThreshold] = useState(18);             // % threshold
  const [manualDrill, setManualDrill] = useState(false);
  const [batteryPercent, setBatteryPercent] = useState(86);
  const [valveOn, setValveOn] = useState(true);
  const [gasStatus, setGasStatus] = useState('NORMAL');
  const [relayState, setRelayState] = useState('INACTIVE');
  const [lastUpdate, setLastUpdate] = useState(null);

  const gasExceeded = detectorOnline && gasStatus === 'DANGER';
  const smokeExceeded = false; // The connected detector currently reports MQ-5 gas telemetry only.
  const fireAlert = detectorOnline && (manualDrill || gasExceeded);
  const allReadingsNormal = detectorOnline && !fireAlert;

  const statusMessage = !detectorOnline
    ? 'Detector disconnected. Please check your connection.'
    : allReadingsNormal
      ? `✅ All readings normal — Live telemetry received from ${DEVICE_ID}`
      : `🚨 ALERT: Gas danger reported by ${DEVICE_ID} — Fire alert active`;

  // Live Firebase telemetry from the ESP32. This replaces the demo timer.
  useEffect(() => {
    const telemetryRef = telemetryDatabase.ref(`devices/${DEVICE_ID}/telemetry`);

    const onTelemetry = (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        setDetectorOnline(false);
        return;
      }

      setDetectorOnline(true);
      setLastHeartbeatAt(Date.now());
      setHasReceivedHeartbeat(true);
      setHighestGasReading(Number(data.gasRaw || 0));
      setGasStatus(data.gasStatus === 'DANGER' ? 'DANGER' : 'NORMAL');
      setValveOn(data.valveState === 'ON');
      setRelayState(data.relayState === 'ACTIVE' ? 'ACTIVE' : 'INACTIVE');
      setLastUpdate(data.updatedAt || Date.now());
    };

    const onError = (error) => {
      console.error('Firebase telemetry connection failed:', error);
      setDetectorOnline(false);
    };

    telemetryRef.on('value', onTelemetry, onError);
    return () => telemetryRef.off('value', onTelemetry);

  useEffect(() => {

                    <span className={`w-3 h-3 mt-1 rounded-full ${device.critical ? 'bg-red-400 shadow-[0_0_12px_rgba(248,113,113,0.9)]' : 'bg-emerald-400 shadow-[0_0_12px_rgba(52,211,153,0.8)]'}`}></span>
                  </div>
                  <div className={`mt-7 text-2xl font-extrabold font-onest tracking-wide ${device.critical ? 'text-white' : 'text-emerald-200'}`}>
                    {device.status}
                  </div>
                  <div className={`mt-2 text-xs font-medium ${device.critical ? 'text-white/85' : device.disconnected ? 'text-gray-400' : 'text-emerald-100/65'}`}>
                    {device.critical ? 'Attention required' : device.disconnected ? 'Waiting for live telemetry' : 'Safety readings are within range'}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>

      </div>
    </section>
  );
}
